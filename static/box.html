<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>M-Team Box</title>
<style>
:root{color-scheme:light dark;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}body{margin:0;background:#f3f5f7;color:#17202a}.wrap{max-width:1180px;margin:0 auto;padding:24px}.top{display:flex;gap:14px;align-items:center;justify-content:space-between;margin-bottom:18px}.top h1{margin:0;font-size:26px}.sub{color:#667085;font-size:13px}.panel{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 1px 2px rgba(0,0,0,.03)}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.card{background:#f8fafc;border-radius:10px;padding:14px}.card b{display:block;font-size:12px;color:#667085;margin-bottom:6px}.card span{font-size:20px;font-weight:700}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.field label{display:block;font-size:12px;color:#667085;margin:0 0 6px}.field input{width:100%;box-sizing:border-box;padding:9px 10px;border:1px solid #d0d5dd;border-radius:8px;background:#fff;color:#111}.wide{grid-column:1/-1}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}button,a.btn{border:0;border-radius:8px;padding:9px 13px;font-weight:650;cursor:pointer;text-decoration:none;background:#111827;color:#fff}button.alt,a.alt{background:#e5e7eb;color:#111827}button.warn{background:#b42318}.muted{font-size:12px;color:#667085}.ok{color:#067647}.bad{color:#b42318}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:9px 7px;border-bottom:1px solid #eee}th{color:#667085}.log{font-size:12px;line-height:1.6;max-height:360px;overflow:auto}.log-item{padding:8px;border-bottom:1px solid #eee}.pill{display:inline-block;padding:2px 7px;border-radius:999px;background:#eef2ff;margin-right:5px}.login-tip{padding:18px;background:#fff3cd;border-radius:10px}@media(max-width:820px){.cards,.grid{grid-template-columns:1fr 1fr}.wide{grid-column:1/-1}}@media(max-width:560px){.cards,.grid{grid-template-columns:1fr}.wrap{padding:14px}}@media(prefers-color-scheme:dark){body{background:#101214;color:#e8eaed}.panel{background:#171a1d;border-color:#2a2f34}.card{background:#202428}.field input{background:#101214;color:#fff;border-color:#3a4047}.sub,.muted,.field label,.card b,th{color:#aab2bd}th,td,.log-item{border-color:#2c3136}button.alt,a.alt{background:#30363d;color:#fff}}
</style>
</head>
<body><div class="wrap">
<div class="top"><div><h1>🐹 M-Team Box</h1><div class="sub">RSS 抢新种 · qBittorrent · 小盘滚种 · 流量钱包</div></div><a class="btn alt" href="/">返回种控台</a></div>
<div id="needLogin" class="login-tip" hidden>还没有种控台登录状态。请先 <a href="/">回首页登录</a>，登录后再打开本页。</div>
<div id="app" hidden>
<div class="panel"><div class="cards">
<div class="card"><b>运行状态</b><span id="running">-</span></div>
<div class="card"><b>本周期流量</b><span id="traffic">-</span></div>
<div class="card"><b>磁盘可用</b><span id="disk">-</span></div>
<div class="card"><b>盒子任务</b><span id="tasks">-</span></div>
</div><div class="muted" style="margin-top:10px" id="lastRun"></div></div>

<div class="panel"><h3>盒子配置</h3><div class="grid">
<div class="field wide"><label>M-Team RSS 私有地址</label><input id="rss_url" placeholder="留空表示保留已保存地址" /></div>
<div class="field"><label>RSS 轮询（秒）</label><input id="rss_poll_seconds" type="number" min="20" /></div>
<div class="field"><label>qBittorrent WebUI</label><input id="qbit_url" /></div>
<div class="field"><label>qBit 用户名</label><input id="qbit_username" /></div>
<div class="field"><label>qBit 密码</label><input id="qbit_password" type="password" placeholder="留空表示保留" /></div>
<div class="field"><label>下载目录</label><input id="download_dir" /></div>
<div class="field"><label>vnStat 网卡</label><input id="vnstat_interface" placeholder="eth0" /></div>
<div class="field"><label>最小体积 GB</label><input id="min_size_gb" type="number" step="0.1" /></div>
<div class="field"><label>最大体积 GB</label><input id="max_size_gb" type="number" step="0.1" /></div>
<div class="field"><label>最大种龄（秒）</label><input id="max_age_seconds" type="number" /></div>
<div class="field"><label>最少 Leecher</label><input id="min_leechers" type="number" /></div>
<div class="field"><label>最多 Seeder</label><input id="max_seeders" type="number" /></div>
<div class="field"><label>最低需求比 L/(S+1)</label><input id="min_demand" type="number" step="0.05" /></div>
<div class="field"><label>最低抢流评分</label><input id="min_score" type="number" step="1" /></div>
<div class="field"><label>同时下载数</label><input id="max_active_downloads" type="number" /></div>
<div class="field"><label>盒子数据上限 GB</label><input id="data_cap_gb" type="number" step="0.5" /></div>
<div class="field"><label>磁盘安全预留 GB</label><input id="disk_reserve_gb" type="number" step="0.5" /></div>
<div class="field"><label>流量软预算 GB</label><input id="traffic_budget_gb" type="number" step="10" /></div>
<div class="field"><label>流量硬停止 GB</label><input id="traffic_hard_stop_gb" type="number" step="10" /></div>
<div class="field"><label>账期重置日</label><input id="billing_reset_day" type="number" min="1" max="31" /></div>
<div class="field"><label>满分享率自动淘汰</label><input id="cleanup_ratio" type="number" step="0.05" /></div>
<div class="field"><label>完成后空闲多少分钟淘汰</label><input id="cleanup_idle_minutes" type="number" /></div>
<div class="field"><label>至少做种多少分钟再判空闲</label><input id="cleanup_min_seed_minutes" type="number" /></div>
</div>
<div class="actions"><button onclick="saveCfg()">保存配置</button><button class="alt" onclick="testQb()">测试 qBittorrent</button><button class="alt" onclick="runOnce()">立即扫一次 RSS</button><button onclick="startBox()">启动</button><button class="warn" onclick="stopBox()">停止</button><button class="alt" onclick="cleanup()">立即淘汰</button><button class="alt" onclick="resetTraffic()">重置流量基线</button></div>
<div class="muted" id="msg" style="margin-top:10px"></div></div>

<div class="panel"><h3>当前 qBittorrent 盒子任务</h3><div style="overflow:auto"><table><thead><tr><th>名称</th><th>状态</th><th>进度</th><th>下载</th><th>上传</th><th>Ratio</th><th>速度</th></tr></thead><tbody id="torrentRows"></tbody></table></div></div>
<div class="panel"><h3>最近判断</h3><div class="log" id="decisions"></div></div>
</div></div>
<script>
const token=localStorage.getItem('mt_pt_token')||'';
const $=id=>document.getElementById(id);
const numFields=['rss_poll_seconds','min_size_gb','max_size_gb','max_age_seconds','min_leechers','max_seeders','min_demand','min_score','max_active_downloads','data_cap_gb','disk_reserve_gb','traffic_budget_gb','traffic_hard_stop_gb','billing_reset_day','cleanup_ratio','cleanup_idle_minutes','cleanup_min_seed_minutes'];
const strFields=['rss_url','qbit_url','qbit_username','qbit_password','download_dir','vnstat_interface'];
function fmtBytes(n){n=Number(n||0);for(const u of ['B','KB','MB','GB','TB']){if(Math.abs(n)<1024)return n.toFixed(u==='B'?0:1)+u;n/=1024}return n.toFixed(1)+'PB'}
async function api(path,opt={}){const h={...(opt.headers||{})};if(opt.body)h['Content-Type']='application/json';if(token)h.Authorization='Bearer '+token;const r=await fetch(path,{...opt,headers:h});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.detail||d.message||r.statusText);return d}
function message(t,bad=false){$('msg').className=bad?'bad':'ok';$('msg').textContent=t}
async function loadCfg(){const c=await api('/api/box/config');for(const k of [...numFields,...strFields]){if(k==='rss_url'||k==='qbit_password')continue;if($(k)&&c[k]!==undefined)$(k).value=c[k]}$('rss_url').placeholder=c.rss_url_set?'已保存 RSS 地址；留空不修改':'粘贴个人 RSS 地址';$('qbit_password').placeholder=c.qbit_password_set?'已保存密码；留空不修改':'输入 qBit WebUI 密码'}
async function saveCfg(){try{const body={};for(const k of strFields){const v=$(k).value.trim();if(v)body[k]=v}for(const k of numFields){const v=$(k).value;if(v!=='')body[k]=Number(v)}await api('/api/box/config',{method:'POST',body:JSON.stringify(body)});$('rss_url').value='';$('qbit_password').value='';await loadCfg();message('配置已保存')}catch(e){message(e.message,true)}}
async function testQb(){try{await saveCfg();const d=await api('/api/box/qbit/test',{method:'POST'});message(`qBittorrent ${d.version} 连接正常，状态 ${d.connection_status||'-'}`)}catch(e){message(e.message,true)}}
async function runOnce(){try{message('正在扫描 RSS…');const d=await api('/api/box/run',{method:'POST'});message(`扫描完成：新增 ${d.added?.length||0}，观察 ${d.pending?.length||0}，淘汰 ${d.rejected?.length||0}`);await loadStatus()}catch(e){message(e.message,true)}}
async function startBox(){try{await api('/api/box/start',{method:'POST'});message('盒子模式已启动');await loadStatus()}catch(e){message(e.message,true)}}
async function stopBox(){try{await api('/api/box/stop',{method:'POST'});message('盒子模式已停止');await loadStatus()}catch(e){message(e.message,true)}}
async function cleanup(){try{const d=await api('/api/box/cleanup',{method:'POST'});message(`本轮淘汰 ${d.deleted?.length||0} 个任务`);await loadStatus()}catch(e){message(e.message,true)}}
async function resetTraffic(){if(!confirm('从现在开始重新计算本账期盒子流量？'))return;try{await api('/api/box/traffic/reset',{method:'POST'});message('流量基线已重置');await loadStatus()}catch(e){message(e.message,true)}}
async function loadStatus(){const s=await api('/api/box/status');$('running').textContent=s.running?'运行中':'已停止';$('running').className=s.running?'ok':'bad';$('traffic').textContent=s.traffic?.used_gb!==undefined?`${s.traffic.used_gb} / ${s.traffic.budget_gb} GB`:'-';$('disk').textContent=s.disk?.free_gb!==undefined?s.disk.free_gb+' GB':'-';$('tasks').textContent=s.qbit?.summary?.count??'-';$('lastRun').textContent=`最近扫描：${s.last_run_at||'尚未'}${s.last_error?' · 错误：'+s.last_error:''}`;const rows=s.qbit?.items||[];$('torrentRows').innerHTML=rows.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.state)}</td><td>${x.progress_pct}%</td><td>${fmtBytes(x.downloaded)}</td><td>${fmtBytes(x.uploaded)}</td><td>${Number(x.ratio||0).toFixed(2)}</td><td>↓${fmtBytes(x.dlspeed)}/s ↑${fmtBytes(x.upspeed)}/s</td></tr>`).join('')||'<tr><td colspan="7" class="muted">暂无盒子任务</td></tr>';$('decisions').innerHTML=(s.decisions||[]).map(x=>`<div class="log-item"><span class="pill">${esc(x.result||'-')}</span><b>${esc(x.name||x.torrent_id||'-')}</b><br><span class="muted">${esc(x.at||'')} · score ${x.score??'-'} · ${esc(x.reason||'')}</span></div>`).join('')||'<div class="muted">还没有判断记录</div>'}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
if(!token){$('needLogin').hidden=false}else{$('app').hidden=false;Promise.all([loadCfg(),loadStatus()]).catch(e=>message(e.message,true));setInterval(()=>loadStatus().catch(()=>{}),15000)}
</script></body></html>
