name: Box mode CI

on:
  push:
    branches:
      - "feat/mteam-box-qb-rss"
  pull_request:
    paths:
      - "app/box_*.py"
      - "app/qbittorrent.py"
      - "static/box-*.js"
      - "static/box-integrated.css"
      - "tests/test_box_*.py"
      - ".github/workflows/box-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile Python
        run: python -m compileall -q app tests
      - name: Check box frontend syntax
        run: |
          node --check static/box-integrated.js
          node --check static/box-decision-ui.js
      - name: Box decision tests
        run: python -m unittest discover -s tests -p 'test_box_*.py' -v
