name: Box mode CI

on:
  push:
    branches:
      - "feat/mteam-box-qb-rss"
  pull_request:
    paths:
      - "app/box_*.py"
      - "app/qbittorrent.py"
      - "tests/test_box_scoring.py"
      - ".github/workflows/box-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile
        run: python -m compileall -q app tests
      - name: Box scoring tests
        run: python -m unittest tests.test_box_scoring
